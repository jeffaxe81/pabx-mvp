name: AXE PABX | laboratório Asterisk real

"on":
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pabx-real-lab-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  incoming-dids:
    name: Asterisk | DIDs conhecidos e rejeição segura
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar cliente SRTP fixado de laboratório
        run: python3 -m pip install -r lab/requirements.txt
      - name: Validar três empresas e três rejeições sem toque cruzado
        run: python3 -m lab.asterisk_lab --calls --dids --report lab-results/incoming-dids.json
      - name: Preservar somente resultado sanitizado dos DIDs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asterisk-real-incoming-dids-${{ github.sha }}
          path: lab-results/incoming-dids.json
          if-no-files-found: error
          retention-days: 14
  sip-tls:
    name: Asterisk | SIP TLS autenticado
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Subir Asterisk isolado e registrar t1, t2 e t3
        run: python3 -m lab.asterisk_lab --report lab-results/registration.json
      - name: Preservar somente relatório sanitizado
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asterisk-real-registration-${{ github.sha }}
          path: lab-results/registration.json
          if-no-files-found: error
          retention-days: 14
  webrtc:
    name: Chromium | Webphone WSS e DTLS-SRTP reais
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Dependências fixadas de teste
        run: |
          python3 -m pip install -r lab/requirements.txt
          npm ci --ignore-scripts --no-audit --no-fund
          npm run check:sip
      - name: Selecionar Chromium do runner
        shell: bash
        run: |
          pabx_chrome_path="$(command -v google-chrome || command -v chromium || true)"
          if [[ -n "$pabx_chrome_path" ]]; then
            echo "PABX_BROWSER_EXECUTABLE=$pabx_chrome_path" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
          fi
      - name: Testar a UI real com Asterisk e mídia real
        run: python3 -m lab.asterisk_lab --calls --webrtc --report lab-results/webrtc.json
      - name: Preservar somente resultado sanitizado WebRTC
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asterisk-real-webrtc-${{ github.sha }}
          path: lab-results/webrtc.json
          if-no-files-found: error
          retention-days: 14
  secure-calls:
    name: Asterisk | chamadas, CDR e SRTP bidirecional
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar libsrtp somente no cliente de laboratório
        run: python3 -m pip install -r lab/requirements.txt
      - name: Ligar nos dois sentidos em t1, t2 e t3
        run: python3 -m lab.asterisk_lab --calls --report lab-results/secure-calls.json
      - name: Preservar somente relatório sanitizado de chamadas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asterisk-real-calls-${{ github.sha }}
          path: lab-results/secure-calls.json
          if-no-files-found: error
          retention-days: 14

  tenant-isolation:
    name: Asterisk | tentativa SIP cruzada entre empresas
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar cliente SRTP isolado
        run: python3 -m pip install -r lab/requirements.txt
      - name: Provar negação e ausência de toque entre empresas
        run: python3 -m lab.asterisk_lab --calls --isolation --report lab-results/tenant-isolation.json
      - name: Preservar relatório sanitizado de isolamento SIP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asterisk-sip-tenant-isolation-${{ github.sha }}
          path: lab-results/tenant-isolation.json
          if-no-files-found: error
          retention-days: 14

  voicemail-runtime:
    name: Asterisk | caixa postal *97 por empresa (SIP real)
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar cliente SRTP de laboratorio
        run: python3 -m pip install -r lab/requirements.txt
      - name: Validar *97 via SIP real t1, t2 e t3
        run: python3 -m lab.asterisk_lab --calls --voicemail --report lab-results/voicemail.json
      - name: Preservar somente prova sanitizada de mailbox
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asterisk-real-voicemail-${{ github.sha }}
          path: lab-results/voicemail.json
          if-no-files-found: error
          retention-days: 14
