name: AXE PABX | regressão da interface

"on":
  pull_request:
    paths:
      - "ui/**"
      - "webphone/**"
      - "admin/index.html"
      - "scripts/sync_ui.py"
      - "tests/ui_*.cjs"
      - "tests/sip_bundle.test.cjs"
      - "tests/webphone_media.test.cjs"
      - "tests/webrtc_contract.test.cjs"
      - "lab/webrtc_browser.cjs"
      - "scripts/build_webphone_sip.cjs"
      - "package*.json"
      - ".github/workflows/ui-regression.yml"
  push:
    branches:
      - main
    paths:
      - "ui/**"
      - "webphone/**"
      - "admin/index.html"
      - "scripts/sync_ui.py"
      - "tests/ui_*.cjs"
      - "tests/sip_bundle.test.cjs"
      - "tests/webphone_media.test.cjs"
      - "tests/webrtc_contract.test.cjs"
      - "lab/webrtc_browser.cjs"
      - "scripts/build_webphone_sip.cjs"
      - "package*.json"
      - ".github/workflows/ui-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  navigation:
    name: Node | navegação
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Testar links e preservação de contexto
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run test:node

  browser:
    name: Chromium | responsividade e permissões
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Instalar Playwright fixado
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Usar Chrome do runner ou instalar Chromium
        shell: bash
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v chromium || true)"
          if [[ -n "$CHROME_BIN" ]]; then
            echo "PABX_BROWSER_EXECUTABLE=$CHROME_BIN" >> "$GITHUB_ENV"
            echo "Usando navegador pré-instalado do runner."
          else
            npx playwright install --with-deps chromium
          fi
      - name: Rodar regressões de navegador com APIs sintéticas
        run: node --test tests/ui_browser.test.cjs
