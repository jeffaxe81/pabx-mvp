[general]
enabled=yes
bindaddr=0.0.0.0
bindport=8088

; WSS (WebSocket seguro) - obrigatório para navegadores fora de localhost,
; pois getUserMedia (captura de microfone) exige contexto seguro (HTTPS/WSS)
tlsenable=yes
tlsbindaddr=0.0.0.0:8089
tlscertfile=/etc/asterisk/certs/asterisk.crt
tlsprivatekey=/etc/asterisk/certs/asterisk.key
