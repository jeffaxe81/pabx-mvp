[general]
static=yes
writeprotect=no
clearglobalvars=no

[globals]

;=====================================================
; TENANT 1 - chamadas internas isoladas
;=====================================================
[t1-internal]
; Linha da recepção - agora entra na fila (round-robin entre as
; telefonistas logadas), em vez de discar pra um ramal fixo. Grava
; automaticamente via monitor-type do queues.conf.
exten => 1000,1,Queue(fila-t1)
 same => n,Hangup()

; Ramais diretos de cada telefonista (uso interno da equipe - ex: um
; colega quer falar com uma telefonista específica, não com "a
; recepção" em geral). MixMonitor grava porque isso passa por fora do
; controle da fila.
exten => 1010,1,MixMonitor(/var/spool/asterisk/monitor/${STRFTIME(${EPOCH},,%Y%m%d-%H%M%S)}-${CALLERID(num)}-1010.wav,b)
 same => n,Dial(PJSIP/t1-recepcao,20)
 same => n,Hangup()

exten => 1011,1,MixMonitor(/var/spool/asterisk/monitor/${STRFTIME(${EPOCH},,%Y%m%d-%H%M%S)}-${CALLERID(num)}-1011.wav,b)
 same => n,Dial(PJSIP/t1-recepcao-2,20)
 same => n,Hangup()

exten => 1001,1,Dial(PJSIP/t1-1001,20)
 same => n,VoiceMail(t1-1001@t1,u)
 same => n,Hangup()

exten => 1002,1,Dial(PJSIP/t1-1002,20)
 same => n,VoiceMail(t1-1002@t1,u)
 same => n,Hangup()

exten => 600,1,Answer()
 same => n,Echo()
 same => n,Hangup()

exten => *97,1,VoiceMailMain(${CALLERID(num)}@t1)
 same => n,Hangup()

; Chamada de saída via tronco TDM - ex: discar 0 + numero
;
; Regras de discagem externa (backlog #14): bloqueio de números via
; AstDB (gerenciado pelo painel de administração), e prefixo "00"
; roteia pela operadora alternativa em vez da padrão.
exten => _0.,1,Set(DESTINO=${EXTEN:1})
 same => n,GotoIf($["${DB(blocklist/${DESTINO})}" = "1"]?numero-bloqueado,1)
 same => n,GotoIf($[${REGEX("^0" ,${DESTINO})} = 1]?rota-alternativa,1)
 same => n,Dial(PJSIP/${DESTINO}@gateway-tdm,30)
 same => n,Hangup()

; Chamada bloqueada - número está na lista de bloqueio (AstDB, família
; "blocklist", gerenciada pelo painel de administração)
exten => numero-bloqueado,1,NoOp(Chamada bloqueada pela regra de discagem: ${DESTINO})
 same => n,Congestion()
 same => n,Hangup()

; Rota alternativa - prefixo "00" (dígito extra após o "0" de saída,
; ex: discar 000 + numero) usa o tronco gateway-tdm-2 em vez do padrão
exten => rota-alternativa,1,NoOp(Chamada roteada pela operadora alternativa: ${DESTINO:1})
 same => n,Dial(PJSIP/${DESTINO:1}@gateway-tdm-2,30)
 same => n,Hangup()

; Extensão de teste da fila (sem precisar do gateway TDM físico):
; qualquer ramal do tenant 1 pode discar 800 para simular uma chamada
; entrando na fila de atendimento
exten => 800,1,Queue(fila-t1)
 same => n,Hangup()

; Ramais gerenciados pelo painel de administração (backlog #10) -
; gerado pelo admin-api, não editar na mão, ver manual 16.
#include extensions_dynamic_dial.conf

;=====================================================
; HINTS (BLF) - estado de cada ramal (livre/tocando/ocupado)
; Necessário para a telefonista ver e clicar nos ramais na interface web
;=====================================================
[t1-hints]
; Hint combinado: 1000 aparece "livre" se QUALQUER telefonista
; estiver livre, e "ocupado" só se as duas estiverem em chamada -
; representa a linha de recepção como um todo, não uma pessoa.
exten => 1000,hint,PJSIP/t1-recepcao&PJSIP/t1-recepcao-2
exten => 1010,hint,PJSIP/t1-recepcao
exten => 1011,hint,PJSIP/t1-recepcao-2
exten => 1001,hint,PJSIP/t1-1001
exten => 1002,hint,PJSIP/t1-1002
#include extensions_dynamic_hints.conf

;=====================================================
; TENANT 2 - chamadas internas isoladas (números podem repetir)
;=====================================================
[t2-internal]
exten => 1001,1,Dial(PJSIP/t2-1001,20)
 same => n,VoiceMail(t2-1001@t2,u)
 same => n,Hangup()

exten => 600,1,Answer()
 same => n,Echo()
 same => n,Hangup()

exten => *97,1,VoiceMailMain(${CALLERID(num)}@t2)
 same => n,Hangup()

exten => _0.,1,Dial(PJSIP/${EXTEN:1}@gateway-tdm,30)
 same => n,Hangup()

[t2-hints]
exten => 1001,hint,PJSIP/t2-1001

;=====================================================
; CHAMADAS ENTRANTES DO GATEWAY TDM
; O DID (número discado que chegou pela linha TDM) decide para
; qual tenant a chamada vai. Ajuste os DIDs reais do seu gateway.
;=====================================================
[from-tdm-gateway]
; DID 5511900001111 pertence ao tenant 1, cai no ramal 1001
exten => 5511900001111,1,Goto(t1-internal,1001,1)

; DID 5511900002222 pertence ao tenant 2, cai no ramal 1001
exten => 5511900002222,1,Goto(t2-internal,1001,1)

; Qualquer outro número não mapeado entra na fila de atendimento -
; toca direto na telefonista se ela estiver livre, ou espera até
; ela puxar pelo painel se estiver ocupada (ver manual 08)
exten => _X.,1,Queue(fila-t1)
 same => n,Hangup()

;=====================================================
; PICKUP DIRIGIDO - usado pelo queue-api via AMI Redirect quando uma
; telefonista clica "Atender" numa chamada específica da fila no
; painel web. Com múltiplas telefonistas, o Redirect especifica QUAL
; ramal deve receber a chamada (Exten=t1-recepcao ou t1-recepcao-2) -
; por isso uma entrada por telefonista, não uma genérica. Não é
; discado por nenhum humano diretamente.
;=====================================================
[pickup-target]
exten => t1-recepcao,1,MixMonitor(/var/spool/asterisk/monitor/${STRFTIME(${EPOCH},,%Y%m%d-%H%M%S)}-${CALLERID(num)}-pickup.wav,b)
 same => n,Dial(PJSIP/t1-recepcao,20)
 same => n,Hangup()

exten => t1-recepcao-2,1,MixMonitor(/var/spool/asterisk/monitor/${STRFTIME(${EPOCH},,%Y%m%d-%H%M%S)}-${CALLERID(num)}-pickup.wav,b)
 same => n,Dial(PJSIP/t1-recepcao-2,20)
 same => n,Hangup()

;=====================================================
; CLICK-TO-CALL - usado pelo queue-api via AMI Originate quando um
; CRM externo dispara uma ligação. O Asterisk liga primeiro pro ramal
; da telefonista; quando ela atende, cai aqui e disca pro número do
; cliente através do mesmo tronco TDM usado nas chamadas de saída
; normais. Não é discado por nenhum humano diretamente.
;=====================================================
[click-to-call]
exten => _X.,1,Dial(PJSIP/${EXTEN}@gateway-tdm,30)
 same => n,Hangup()
