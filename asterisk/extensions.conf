[general]
static=yes
writeprotect=no
clearglobalvars=no

[globals]

;=====================================================
; TENANT 1 - chamadas internas isoladas
;=====================================================
[t1-internal]
; Linha da recepção - agora entra na fila (round-robin entre as
; telefonistas logadas), em vez de discar pra um ramal fixo. Grava
; automaticamente via monitor-type do queues.conf.
; hangup_handler_push coleta estatísticas de qualidade (RTCP) quando
; a chamada terminar - ver contexto [qualidade-chamada] e manual 29.
; A opção "c" do Queue() mantém o CLIENTE na linha depois que a
; telefonista desliga, em vez de derrubar a chamada - é isso que
; permite a pesquisa de satisfação (backlog #27, manual 32).
; ${QUEUESTATUS}="CONTINUE" só acontece se um agente atendeu e depois
; desligou (por causa do "c") - só nesse caso faz sentido pesquisar
; satisfação. Se ninguém atendeu (TIMEOUT/JOINEMPTY/etc), cai na
; caixa de recado em vez de "pesquisar satisfação" de uma conversa
; que nunca aconteceu.
; ${TENANT} default "t1" cobre discagem direta/interna do 1000 (sem
; passar pela URA, que já define TENANT antes de chegar aqui) - ver
; manual 38 sobre o desenho multi-tenant.
exten => 1000,1,Answer()
 same => n,Playback(custom/aviso-gravacao)
 same => n,Set(CHANNEL(hangup_handler_push)=qualidade-chamada,s,1)
 same => n,Set(TENANT=${IF($["${TENANT}" = ""]?t1:${TENANT})})
 same => n,Set(FILA_IDIOMA=${IF($["${FILA_IDIOMA}" = ""]?fila-${TENANT}:${FILA_IDIOMA})})
 same => n,Queue(${FILA_IDIOMA},c)
 same => n,GotoIf($["${QUEUESTATUS}" = "CONTINUE"]?pesquisa-satisfacao,s,1)
 same => n,VoiceMail(${TENANT}-1001@${TENANT},u)
 same => n,Hangup()

; Ramais diretos de cada telefonista (uso interno da equipe - ex: um
; colega quer falar com uma telefonista específica, não com "a
; recepção" em geral). MixMonitor grava porque isso passa por fora do
; controle da fila. Dial(...,g) tem o mesmo efeito do "c" acima, só
; que pro app Dial() em vez de Queue().
; ${DIALSTATUS}="ANSWER" idem acima - só pesquisa satisfação se
; alguém realmente atendeu. Sem resposta/ocupado/etc = RETORNO
; AUTOMÁTICO pra fila geral (backlog #28: "transferência inteligente"
; precisa devolver a chamada em vez de simplesmente desistir dela).
exten => 1010,1,Answer()
 same => n,Playback(custom/aviso-gravacao)
 same => n,Set(CHANNEL(hangup_handler_push)=qualidade-chamada,s,1)
 same => n,MixMonitor(/var/spool/asterisk/monitor/${STRFTIME(${EPOCH},,%Y%m%d-%H%M%S)}-${CALLERID(num)}-1010.wav,b)
 same => n,Dial(PJSIP/t1-recepcao,20,g)
 same => n,GotoIf($["${DIALSTATUS}" = "ANSWER"]?pesquisa-satisfacao,s,1)
 same => n,Goto(t1-internal,1000,1)

exten => 1011,1,Answer()
 same => n,Playback(custom/aviso-gravacao)
 same => n,Set(CHANNEL(hangup_handler_push)=qualidade-chamada,s,1)
 same => n,MixMonitor(/var/spool/asterisk/monitor/${STRFTIME(${EPOCH},,%Y%m%d-%H%M%S)}-${CALLERID(num)}-1011.wav,b)
 same => n,Dial(PJSIP/t1-recepcao-2,20,g)
 same => n,GotoIf($["${DIALSTATUS}" = "ANSWER"]?pesquisa-satisfacao,s,1)
 same => n,Goto(t1-internal,1000,1)

exten => 1001,1,Dial(PJSIP/t1-1001,20)
 same => n,VoiceMail(t1-1001@t1,u)
 same => n,Hangup()

exten => 1002,1,Dial(PJSIP/t1-1002,20)
 same => n,VoiceMail(t1-1002@t1,u)
 same => n,Hangup()

exten => 600,1,Answer()
 same => n,Echo()
 same => n,Hangup()

exten => *97,1,VoiceMailMain(${CALLERID(num)}@t1)
 same => n,Hangup()

; Chamada de saída via tronco TDM - ex: discar 0 + numero
;
; Regras de discagem externa (backlog #14): bloqueio de números via
; AstDB (gerenciado pelo painel de administração, família por tenant
; - ver manual 38), e prefixo "00" roteia pela operadora alternativa
; em vez da padrão.
exten => _0.,1,Set(DESTINO=${EXTEN:1})
 same => n,GotoIf($["${DB(blocklist-t1/${DESTINO})}" = "1"]?numero-bloqueado,1)
 same => n,GotoIf($[${REGEX("^0" ,${DESTINO})} = 1]?rota-alternativa,1)
 same => n,Dial(PJSIP/${DESTINO}@gateway-tdm,30)
 same => n,Hangup()

; Chamada bloqueada - número está na lista de bloqueio (AstDB, família
; "blocklist-t1", gerenciada pelo painel de administração)
exten => numero-bloqueado,1,NoOp(Chamada bloqueada pela regra de discagem: ${DESTINO})
 same => n,Congestion()
 same => n,Hangup()

; Rota alternativa - prefixo "00" (dígito extra após o "0" de saída,
; ex: discar 000 + numero) usa o tronco gateway-tdm-2 em vez do padrão
exten => rota-alternativa,1,NoOp(Chamada roteada pela operadora alternativa: ${DESTINO:1})
 same => n,Dial(PJSIP/${DESTINO:1}@gateway-tdm-2,30)
 same => n,Hangup()

; Extensão de teste da fila (sem precisar do gateway TDM físico):
; qualquer ramal do tenant 1 pode discar 800 para simular uma chamada
; entrando na fila de atendimento
exten => 800,1,Queue(fila-t1)
 same => n,Hangup()

; Extensão de teste da URA (sem precisar do gateway TDM físico):
; qualquer ramal do tenant 1 pode discar 700 para simular uma chamada
; entrando pela URA
exten => 700,1,Set(TENANT=t1)
 same => n,Goto(ura-principal,s,1)

; Extensão de teste do atendente virtual (backlog #24) - qualquer
; ramal do tenant 1 pode discar 650 pra testar sem precisar do
; gateway TDM físico
exten => 650,1,Set(TENANT=t1)
 same => n,Goto(atendente-virtual,s,1)

;=====================================================
; MONITORAMENTO DE CHAMADA (backlog #42) - *81/*82/*83 + ramal da
; telefonista (1010 ou 1011). Protegido por PIN (por tenant,
; configurado pelo painel de administração) - ver contexto
; compartilhado [chamada-monitorada] e manual 42 pras implicações
; legais/trabalhistas antes de usar isso de verdade.
;=====================================================
exten => _*81X.,1,Set(TENANT=t1)
 same => n,Set(MONITOR_MODE=listen)
 same => n,Set(MONITOR_TARGET=${EXTEN:3})
 same => n,Goto(chamada-monitorada,s,1)

exten => _*82X.,1,Set(TENANT=t1)
 same => n,Set(MONITOR_MODE=whisper)
 same => n,Set(MONITOR_TARGET=${EXTEN:3})
 same => n,Goto(chamada-monitorada,s,1)

exten => _*83X.,1,Set(TENANT=t1)
 same => n,Set(MONITOR_MODE=barge)
 same => n,Set(MONITOR_TARGET=${EXTEN:3})
 same => n,Goto(chamada-monitorada,s,1)

; Sala de conferência ad-hoc (backlog #43) - disque 40 + 4 dígitos
; (ex: 400001) pra entrar/criar a sala. O nome da sala já embute o
; tenant (sala-t1-0001), então dois tenants discando o mesmo número
; nunca caem na mesma sala - ver asterisk/confbridge.conf.
exten => _40XXXX,1,Set(TENANT=t1)
 same => n,Answer()
 same => n,ConfBridge(sala-${TENANT}-${EXTEN:2},default_bridge,default_user,default_menu)

;=====================================================
; GRUPOS DE TOQUE (backlog #18) - diferente de fila (Queue): não tem
; música de espera, posição, nem estatística - é só "toca em vários
; ramais" pra casos simples. Pra adicionar/remover membros, edite a
; lista de PJSIP/... aqui e o hint correspondente em [t1-hints].
;=====================================================

; Grupo SIMULTÂNEO - todos tocam ao mesmo tempo, quem atender primeiro
; fica com a chamada. Bom pra "qualquer um da equipe pode atender".
exten => 900,1,Dial(PJSIP/t1-1001&PJSIP/t1-1002&PJSIP/t1-recepcao,20)
 same => n,VoiceMail(t1-1001@t1,u)
 same => n,Hangup()

; Grupo em SEQUÊNCIA - toca um de cada vez, 10s cada, na ordem
; definida. Bom pra "tenta o principal primeiro, se não atender tenta
; o próximo".
exten => 901,1,Dial(PJSIP/t1-1001,10)
 same => n,Dial(PJSIP/t1-1002,10)
 same => n,Dial(PJSIP/t1-recepcao,10)
 same => n,VoiceMail(t1-1001@t1,u)
 same => n,Hangup()

; Ramais gerenciados pelo painel de administração (backlog #10/#38) -
; gerado pelo admin-api, não editar na mão, ver manual 16/38.
#include extensions_dynamic_dial-t1.conf

;=====================================================
; HINTS (BLF) - estado de cada ramal (livre/tocando/ocupado)
; Necessário para a telefonista ver e clicar nos ramais na interface web
;=====================================================
[t1-hints]
; Hint combinado: 1000 aparece "livre" se QUALQUER telefonista
; estiver livre, e "ocupado" só se as duas estiverem em chamada -
; representa a linha de recepção como um todo, não uma pessoa.
exten => 1000,hint,PJSIP/t1-recepcao&PJSIP/t1-recepcao-2
exten => 1010,hint,PJSIP/t1-recepcao
exten => 1011,hint,PJSIP/t1-recepcao-2
exten => 1001,hint,PJSIP/t1-1001
exten => 1002,hint,PJSIP/t1-1002
; Grupos de toque (backlog #18) - mesmo conjunto de membros nos dois,
; só a estratégia de toque muda entre 900 e 901
exten => 900,hint,PJSIP/t1-1001&PJSIP/t1-1002&PJSIP/t1-recepcao
exten => 901,hint,PJSIP/t1-1001&PJSIP/t1-1002&PJSIP/t1-recepcao
#include extensions_dynamic_hints-t1.conf

;=====================================================
; TENANT 2 - chamadas internas isoladas (números podem repetir).
; Mesmo conjunto de recursos do tenant 1 (fila, telefonistas web,
; testes de URA/atendente virtual) - a URA, o click-to-call, o
; callback etc. são contextos ÚNICOS e COMPARTILHADOS entre tenants,
; parametrizados por ${TENANT} (ver manual 38) - não são duplicados
; aqui, só os pontos que precisam mesmo existir por tenant (ramais,
; fila, teste de entrada).
;=====================================================
[t2-internal]
exten => 1000,1,Answer()
 same => n,Playback(custom/aviso-gravacao)
 same => n,Set(CHANNEL(hangup_handler_push)=qualidade-chamada,s,1)
 same => n,Set(TENANT=${IF($["${TENANT}" = ""]?t2:${TENANT})})
 same => n,Set(FILA_IDIOMA=${IF($["${FILA_IDIOMA}" = ""]?fila-${TENANT}:${FILA_IDIOMA})})
 same => n,Queue(${FILA_IDIOMA},c)
 same => n,GotoIf($["${QUEUESTATUS}" = "CONTINUE"]?pesquisa-satisfacao,s,1)
 same => n,VoiceMail(${TENANT}-1001@${TENANT},u)
 same => n,Hangup()

exten => 1010,1,Answer()
 same => n,Playback(custom/aviso-gravacao)
 same => n,Set(CHANNEL(hangup_handler_push)=qualidade-chamada,s,1)
 same => n,MixMonitor(/var/spool/asterisk/monitor/${STRFTIME(${EPOCH},,%Y%m%d-%H%M%S)}-${CALLERID(num)}-t2-1010.wav,b)
 same => n,Dial(PJSIP/t2-recepcao,20,g)
 same => n,GotoIf($["${DIALSTATUS}" = "ANSWER"]?pesquisa-satisfacao,s,1)
 same => n,Goto(t2-internal,1000,1)

exten => 1011,1,Answer()
 same => n,Playback(custom/aviso-gravacao)
 same => n,Set(CHANNEL(hangup_handler_push)=qualidade-chamada,s,1)
 same => n,MixMonitor(/var/spool/asterisk/monitor/${STRFTIME(${EPOCH},,%Y%m%d-%H%M%S)}-${CALLERID(num)}-t2-1011.wav,b)
 same => n,Dial(PJSIP/t2-recepcao-2,20,g)
 same => n,GotoIf($["${DIALSTATUS}" = "ANSWER"]?pesquisa-satisfacao,s,1)
 same => n,Goto(t2-internal,1000,1)

exten => 1001,1,Dial(PJSIP/t2-1001,20)
 same => n,VoiceMail(t2-1001@t2,u)
 same => n,Hangup()

exten => 600,1,Answer()
 same => n,Echo()
 same => n,Hangup()

exten => *97,1,VoiceMailMain(${CALLERID(num)}@t2)
 same => n,Hangup()

; Mesma regra de discagem externa do tenant 1, só que na família de
; bloqueio própria do tenant 2 (blocklist-t2) - listas independentes,
; bloquear um número no tenant 1 não afeta o tenant 2.
exten => _0.,1,Set(DESTINO=${EXTEN:1})
 same => n,GotoIf($["${DB(blocklist-t2/${DESTINO})}" = "1"]?numero-bloqueado,1)
 same => n,Dial(PJSIP/${DESTINO}@gateway-tdm,30)
 same => n,Hangup()

exten => numero-bloqueado,1,NoOp(Chamada bloqueada pela regra de discagem: ${DESTINO})
 same => n,Congestion()
 same => n,Hangup()

; Extensões de teste (mesmos números do tenant 1 - contextos são
; isolados, não há conflito nenhum)
exten => 800,1,Queue(fila-t2)
 same => n,Hangup()

exten => 700,1,Set(TENANT=t2)
 same => n,Goto(ura-principal,s,1)

exten => 650,1,Set(TENANT=t2)
 same => n,Goto(atendente-virtual,s,1)

; Monitoramento de chamada (backlog #42) - mesmo esquema do tenant 1
exten => _*81X.,1,Set(TENANT=t2)
 same => n,Set(MONITOR_MODE=listen)
 same => n,Set(MONITOR_TARGET=${EXTEN:3})
 same => n,Goto(chamada-monitorada,s,1)

exten => _*82X.,1,Set(TENANT=t2)
 same => n,Set(MONITOR_MODE=whisper)
 same => n,Set(MONITOR_TARGET=${EXTEN:3})
 same => n,Goto(chamada-monitorada,s,1)

exten => _*83X.,1,Set(TENANT=t2)
 same => n,Set(MONITOR_MODE=barge)
 same => n,Set(MONITOR_TARGET=${EXTEN:3})
 same => n,Goto(chamada-monitorada,s,1)

; Sala de conferência ad-hoc (backlog #43) - mesmo esquema do tenant 1
exten => _40XXXX,1,Set(TENANT=t2)
 same => n,Answer()
 same => n,ConfBridge(sala-${TENANT}-${EXTEN:2},default_bridge,default_user,default_menu)

; Ramais gerenciados pelo painel de administração (backlog #10/#38) -
; gerado pelo admin-api, não editar na mão, ver manual 16/38.
#include extensions_dynamic_dial-t2.conf

[t2-hints]
exten => 1000,hint,PJSIP/t2-recepcao&PJSIP/t2-recepcao-2
exten => 1010,hint,PJSIP/t2-recepcao
exten => 1011,hint,PJSIP/t2-recepcao-2
exten => 1001,hint,PJSIP/t2-1001
#include extensions_dynamic_hints-t2.conf

;=====================================================
; CHAMADAS ENTRANTES DO GATEWAY TDM
; O DID (número discado que chegou pela linha TDM) decide para
; qual tenant a chamada vai. Ajuste os DIDs reais do seu gateway.
;=====================================================
[from-tdm-gateway]
; DID 5511900001111 pertence ao tenant 1, cai no ramal 1001
exten => 5511900001111,1,Set(TENANT=t1)
 same => n,Goto(t1-internal,1001,1)

; DID 5511900002222 pertence ao tenant 2, cai no ramal 1001
exten => 5511900002222,1,Set(TENANT=t2)
 same => n,Goto(t2-internal,1001,1)

; Qualquer outro DID entra na URA do tenant certo (backlog #39: o
; wizard de preparação de ambiente registra o DID de cada tenant novo
; na família AstDB "tenant-did" - sem precisar editar este arquivo pra
; cada tenant criado). Se o DID discado não estiver registrado pra
; nenhum tenant, cai no tenant 1 por padrão (mesmo comportamento de
; antes, agora explícito em vez de acidental).
exten => _X.,1,Set(TENANT=${DB(tenant-did/${EXTEN})})
 same => n,Set(TENANT=${IF($["${TENANT}" = ""]?t1:${TENANT})})
 same => n,Goto(ura-principal,s,1)

;=====================================================
; URA (backlog #17) - menu de voz pra chamadas sem ramal específico.
; CONTEXTO ÚNICO E COMPARTILHADO entre tenants (backlog "multi-tenant
; completo", manual 38) - toda a lógica usa ${TENANT}, que precisa
; estar definido ANTES de chegar aqui (from-tdm-gateway e as
; extensões de teste 700 já fazem isso). Checa feriado (AstDB,
; gerenciado pelo painel de administração, por tenant) ANTES do
; horário comercial - feriado sempre tem prioridade sobre o horário
; normal, mesmo que caia numa segunda-feira às 10h.
;=====================================================
[ura-principal]
exten => s,1,Answer()
 same => n,Set(VIP_DESTINO=${DB(vip-${TENANT}/${CALLERID(num)})})
 same => n,GotoIf($["${VIP_DESTINO}" != ""]?vip-direto,1)
 same => n,Background(custom/menu-idioma)
 same => n,Read(IDIOMA,custom/menu-idioma,1,,2,7)
 same => n,GotoIf($["${IDIOMA}" = "2"]?selecionar-idioma,en,1)
 same => n,GotoIf($["${IDIOMA}" = "3"]?selecionar-idioma,es,1)
 same => n,Goto(selecionar-idioma,pt,1)

; Cliente VIP identificado pelo número (AstDB família "vip-${TENANT}",
; gerenciável pelo painel de administração - manual 33/38) - roteia
; DIRETO pro ramal configurado pra esse cliente, sem passar pela URA
; nem pela fila geral, nem pela seleção de idioma. Tem prioridade
; até sobre o modo feriado. Listas de VIP são independentes por
; tenant - um cliente VIP do tenant 1 não é reconhecido no tenant 2.
exten => vip-direto,1,NoOp(Cliente VIP identificado - roteamento direto pro ramal ${VIP_DESTINO} (tenant ${TENANT}))
 same => n,Goto(${TENANT}-internal,${VIP_DESTINO},1)

;=====================================================
; SELEÇÃO DE IDIOMA (backlog #30) - define qual fila e qual áudio de
; menu usar no resto da chamada. ${FILA_IDIOMA}/${MENU_PRINCIPAL} são
; lidos mais adiante em [horario-comercial] e no ramal 1000. A fila
; escolhida já é a do tenant certo (fila-${TENANT}[-idioma]).
;=====================================================
[selecionar-idioma]
exten => pt,1,Set(FILA_IDIOMA=fila-${TENANT})
 same => n,Set(MENU_PRINCIPAL=custom/menu-principal-pt)
 same => n,Goto(rotear-horario,s,1)

exten => en,1,Set(FILA_IDIOMA=fila-${TENANT}-en)
 same => n,Set(MENU_PRINCIPAL=custom/menu-principal-en)
 same => n,Goto(rotear-horario,s,1)

exten => es,1,Set(FILA_IDIOMA=fila-${TENANT}-es)
 same => n,Set(MENU_PRINCIPAL=custom/menu-principal-es)
 same => n,Goto(rotear-horario,s,1)

; Depois do idioma escolhido, segue o mesmo fluxo de sempre
; (feriado/horário comercial) - só muda a fila e o áudio usados lá na
; frente. Fora de horário e feriado continuam só em português neste
; MVP (ver limitação no manual 35). Modo feriado é lido por tenant
; (AstDB família "config-${TENANT}") - cada tenant liga/desliga o
; próprio feriado independentemente.
[rotear-horario]
exten => s,1,GotoIf($["${DB(config-${TENANT}/modo-feriado)}" = "1"]?feriado,s,1)
 same => n,GotoIfTime(08:00-18:00,mon-fri,*,*?horario-comercial,s,1:fora-horario,s,1)

; Horário comercial: toca o menu e espera o dígito
[horario-comercial]
exten => s,1,Set(MENU_PRINCIPAL=${IF($["${MENU_PRINCIPAL}" = ""]?custom/menu-principal:${MENU_PRINCIPAL})})
 same => n,Background(${MENU_PRINCIPAL})
 same => n,WaitExten(10)

; Opção 1 - vendas: cai na fila normal de atendimento do tenant certo
exten => 1,1,Goto(${TENANT}-internal,1000,1)

; Opção 2 - suporte: exemplo de rota diferente (ramal direto da
; telefonista 1 do tenant certo) - ajuste pra uma fila própria de
; suporte se/quando o projeto tiver mais de uma fila
exten => 2,1,Goto(${TENANT}-internal,1010,1)

; Opção 9 - callback (backlog #26): em vez de esperar na fila, o
; cliente deixa o número e recebe uma ligação de volta quando um
; atendente estiver livre
exten => 9,1,Goto(solicitar-callback,s,1)

; Sem digitar nada a tempo - volta pra fila (não deixa a ligação presa)
exten => t,1,Goto(${TENANT}-internal,1000,1)

; Dígito inválido - avisa e repete o menu
exten => i,1,Playback(pbx-invalid)
 same => n,Goto(horario-comercial,s,1)

; Fora do horário comercial - avisa e manda pra caixa de recado geral
; do tenant certo
[fora-horario]
exten => s,1,Background(custom/menu-fora-horario)
 same => n,VoiceMail(${TENANT}-1001@${TENANT},u)
 same => n,Hangup()

; Modo feriado (ligado manualmente pelo painel de administração, por
; tenant, independente do dia/hora real) - mesma ideia de fora de
; horário, mensagem diferente
[feriado]
exten => s,1,Background(custom/menu-feriado)
 same => n,VoiceMail(${TENANT}-1001@${TENANT},u)
 same => n,Hangup()

;=====================================================
; PICKUP DIRIGIDO - usado pelo queue-api via AMI Redirect quando uma
; telefonista clica "Atender" numa chamada específica da fila no
; painel web. Com múltiplas telefonistas, o Redirect especifica QUAL
; ramal deve receber a chamada (Exten=t1-recepcao, t1-recepcao-2,
; t2-recepcao ou t2-recepcao-2) - por isso uma entrada por
; telefonista/tenant, não uma genérica. Não é discado por nenhum
; humano diretamente.
;=====================================================
[pickup-target]
exten => t1-recepcao,1,Set(CHANNEL(hangup_handler_push)=qualidade-chamada,s,1)
 same => n,MixMonitor(/var/spool/asterisk/monitor/${STRFTIME(${EPOCH},,%Y%m%d-%H%M%S)}-${CALLERID(num)}-pickup.wav,b)
 same => n,Dial(PJSIP/t1-recepcao,20,g)
 same => n,GotoIf($["${DIALSTATUS}" = "ANSWER"]?pesquisa-satisfacao,s,1)
 same => n,Goto(t1-internal,1000,1)

exten => t1-recepcao-2,1,Set(CHANNEL(hangup_handler_push)=qualidade-chamada,s,1)
 same => n,MixMonitor(/var/spool/asterisk/monitor/${STRFTIME(${EPOCH},,%Y%m%d-%H%M%S)}-${CALLERID(num)}-pickup.wav,b)
 same => n,Dial(PJSIP/t1-recepcao-2,20,g)
 same => n,GotoIf($["${DIALSTATUS}" = "ANSWER"]?pesquisa-satisfacao,s,1)
 same => n,Goto(t1-internal,1000,1)

exten => t2-recepcao,1,Set(CHANNEL(hangup_handler_push)=qualidade-chamada,s,1)
 same => n,MixMonitor(/var/spool/asterisk/monitor/${STRFTIME(${EPOCH},,%Y%m%d-%H%M%S)}-${CALLERID(num)}-pickup.wav,b)
 same => n,Dial(PJSIP/t2-recepcao,20,g)
 same => n,GotoIf($["${DIALSTATUS}" = "ANSWER"]?pesquisa-satisfacao,s,1)
 same => n,Goto(t2-internal,1000,1)

exten => t2-recepcao-2,1,Set(CHANNEL(hangup_handler_push)=qualidade-chamada,s,1)
 same => n,MixMonitor(/var/spool/asterisk/monitor/${STRFTIME(${EPOCH},,%Y%m%d-%H%M%S)}-${CALLERID(num)}-pickup.wav,b)
 same => n,Dial(PJSIP/t2-recepcao-2,20,g)
 same => n,GotoIf($["${DIALSTATUS}" = "ANSWER"]?pesquisa-satisfacao,s,1)
 same => n,Goto(t2-internal,1000,1)

;=====================================================
; MONITORAMENTO DE QUALIDADE (backlog #34) - roda como hangup handler
; nos pontos onde a telefonista fala com o cliente. Lê as
; estatísticas RTCP (jitter, perda de pacotes, RTT) do canal que
; acabou de desligar e manda como evento customizado via AMI, que o
; queue-api já escuta - ver manual 29. Já é tenant-agnóstico (o canal
; identifica sozinho quem participou, via ${CHANNEL}).
;=====================================================

;=====================================================
; CHAMADA DE RETORNO / CALLBACK (backlog #26) - o cliente escolheu
; não esperar na fila. Este contexto só registra o pedido (via
; UserEvent, que o queue-api escuta) e agradece - quem efetivamente
; liga de volta depois é o queue-api, via AMI Originate, reaproveitando
; a mesma engenharia do click-to-call (manual 12) só que ao contrário:
; primeiro liga pro CLIENTE, depois conecta no atendente. O tenant é
; passado adiante pro pedido (Tenant=${TENANT}) - é assim que
; [callback-connect] sabe pra qual tenant conectar depois.
;=====================================================
[solicitar-callback]
exten => s,1,Answer()
 same => n,Background(custom/menu-callback)
 same => n,UserEvent(CallbackRequest,CallerIDNum=${CALLERID(num)},CallerIDName=${CALLERID(name)},Tenant=${TENANT})
 same => n,Hangup()

; Executado quando a ligação de RETORNO é atendida pelo cliente - aí
; sim conecta com um atendente do tenant certo. ${TENANT} chega via
; "Variable" no Originate disparado pelo queue-api (ver manual 31/38);
; sem isso, cai em t1 por padrão (mesmo padrão defensivo do resto do
; dialplan).
[callback-connect]
exten => s,1,NoOp(Conectando retorno de chamada ao atendente)
 same => n,Set(TENANT=${IF($["${TENANT}" = ""]?t1:${TENANT})})
 same => n,Dial(PJSIP/${TENANT}-recepcao,20)
 same => n,Hangup()

;=====================================================
; ATENDENTE VIRTUAL COM IA (backlog #24) - primeira camada de
; triagem, não um bot conversacional completo (ver manual 37). O
; cliente descreve em poucas palavras o motivo da ligação, o AGI
; grava e manda pro ai-worker (Whisper + Llama 3 local) classificar,
; e a chamada é roteada automaticamente pro destino certo, no tenant
; certo. DESLIGADO POR PADRÃO junto com o resto da IA
; (AI_FEATURES_ENABLED do ai-worker) - se estiver desligado, o AGI
; cai no destino seguro (fila geral do tenant) sozinho, sem travar a
; chamada.
;=====================================================
[atendente-virtual]
exten => s,1,Set(TENANT=${IF($["${TENANT}" = ""]?t1:${TENANT})})
 same => n,Answer()
 same => n,Playback(custom/menu-atendente-virtual)
 same => n,AGI(atendente_virtual.py)
 same => n,GotoIf($["${INTENT_DESTINO}" != ""]?rotear,1)
 same => n,Goto(${TENANT}-internal,1000,1)

exten => rotear,1,NoOp(Atendente virtual classificou a intenção - roteando pro ramal ${INTENT_DESTINO} (tenant ${TENANT}))
 same => n,Goto(${TENANT}-internal,${INTENT_DESTINO},1)

;=====================================================
; PESQUISA DE SATISFAÇÃO (backlog #27) - o cliente chega aqui depois
; que a telefonista já desligou, graças à opção "c"/"g" nos pontos de
; chamada acima (mantém o CLIENTE na linha em vez de derrubar a
; ligação quando o atendente sai). ${DIALEDPEERNAME} é preenchido
; automaticamente pelo Asterisk com o canal que foi discado por
; último - é como sabemos qual atendente participou da chamada
; (já identifica o tenant junto, pelo prefixo do nome do ramal).
;=====================================================
[pesquisa-satisfacao]
exten => s,1,NoOp(Iniciando pesquisa de satisfacao)
 same => n,Read(NOTA,custom/menu-satisfacao,1,,2,7)
 same => n,GotoIf($["${NOTA}" = ""]?sem-resposta,1)
 same => n,UserEvent(SatisfactionSurvey,Nota=${NOTA},Operator=${DIALEDPEERNAME},CallerIDNum=${CALLERID(num)},CallerIDName=${CALLERID(name)})
 same => n,Hangup()

exten => sem-resposta,1,NoOp(Pesquisa de satisfacao sem resposta)
 same => n,Hangup()

[qualidade-chamada]
exten => s,1,NoOp(Coletando estatisticas de qualidade RTCP)
 same => n,UserEvent(QualityStats,Channel=${CHANNEL},Jitter=${CHANNEL(rtcp,rxjitter)},PacketLoss=${CHANNEL(rtcp,rxploss)},RTT=${CHANNEL(rtcp,rtt)})
 same => n,Return()

;=====================================================
; CLICK-TO-CALL - usado pelo queue-api via AMI Originate quando um
; CRM externo dispara uma ligação. O Asterisk liga primeiro pro ramal
; da telefonista (de qualquer tenant - quem decide é o ramal
; informado na requisição, ver manual 12); quando ela atende, cai
; aqui e disca pro número do cliente através do mesmo tronco TDM
; usado nas chamadas de saída normais. Não é discado por nenhum
; humano diretamente.
;=====================================================
;=====================================================
; MONITORAMENTO DE CHAMADA (backlog #42) - CONTEXTO ÚNICO E
; COMPARTILHADO entre tenants (mesmo padrão da URA/callback/atendente
; virtual - ver manual 38), parametrizado por ${TENANT}/${MONITOR_MODE}/
; ${MONITOR_TARGET}, definidos pelos prefixos *81/*82/*83 acima.
;
; Protegido por PIN por tenant (AstDB família "monitoring-pin-{tenant}",
; configurado pelo painel de administração) - SEM PIN CONFIGURADO, o
; monitoramento fica bloqueado por completo (desligado por padrão,
; mesmo padrão de segurança do resto do projeto). LEIA O MANUAL 42
; sobre as implicações legais/trabalhistas antes de configurar isso
; em produção - monitorar conversa de terceiros tem implicações
; jurídicas reais (LGPD, legislação trabalhista) que vão além de
; "está tecnicamente possível".
;=====================================================
[chamada-monitorada]
exten => s,1,Answer()
 same => n,Set(PIN_ESPERADO=${DB(monitoring-pin-${TENANT}/pin)})
 same => n,GotoIf($["${PIN_ESPERADO}" = ""]?sem-configuracao,1)
 same => n,Read(PIN_DIGITADO,custom/menu-monitoramento-pin,10,,3,10)
 same => n,GotoIf($["${PIN_DIGITADO}" = "${PIN_ESPERADO}"]?autorizado,1)
 same => n,Playback(pbx-invalid)
 same => n,Hangup()

exten => sem-configuracao,1,Playback(custom/menu-monitoramento-nao-configurado)
 same => n,Hangup()

; Mapeia o número de ramal digitado (1010/1011) pro nome do endpoint
; de verdade que o ChanSpy precisa (ex: t1-recepcao) - cobre só as
; telefonistas por enquanto, ver limitação no manual 42.
exten => autorizado,1,NoOp(Monitoramento autorizado - modo ${MONITOR_MODE}, alvo ${MONITOR_TARGET}, tenant ${TENANT})
 same => n,Set(MONITOR_CHANNEL=${IF($["${MONITOR_TARGET}" = "1010"]?${TENANT}-recepcao:${IF($["${MONITOR_TARGET}" = "1011"]?${TENANT}-recepcao-2:)})})
 same => n,GotoIf($["${MONITOR_CHANNEL}" = ""]?destino-invalido,1)
 same => n,GotoIf($["${MONITOR_MODE}" = "listen"]?fazer-escuta,1)
 same => n,GotoIf($["${MONITOR_MODE}" = "whisper"]?fazer-sussurro,1)
 same => n,Goto(fazer-intercalacao,1)

exten => destino-invalido,1,Playback(pbx-invalid)
 same => n,Hangup()

; Escuta silenciosa - "q" evita os avisos sonoros de entrada/saída do
; ChanSpy, mantendo a escuta discreta.
exten => fazer-escuta,1,ChanSpy(${MONITOR_CHANNEL},q)
 same => n,Hangup()

; Sussurro - "w" permite falar só com quem está sendo monitorado, o
; outro lado da chamada não ouve o supervisor.
exten => fazer-sussurro,1,ChanSpy(${MONITOR_CHANNEL},qw)
 same => n,Hangup()

; Intercalação - "B" (barge) entra na conversa de verdade, os três
; lados se ouvem.
exten => fazer-intercalacao,1,ChanSpy(${MONITOR_CHANNEL},qB)
 same => n,Hangup()

[click-to-call]
exten => _X.,1,Dial(PJSIP/${EXTEN}@gateway-tdm,30)
 same => n,Hangup()

;=====================================================
; TENANTS CRIADOS PELO WIZARD DE PREPARAÇÃO DE AMBIENTE (backlog #39)
; Um arquivo por tenant (t3.conf, t4.conf, ...), cada um com os
; contextos [tN-internal] e [tN-hints] completos - ver pjsip.conf pro
; mesmo padrão de wildcard #include. t1/t2 continuam definidos
; estaticamente acima. Ver manual 39.
;=====================================================
#include extensions_tenants/*.conf
