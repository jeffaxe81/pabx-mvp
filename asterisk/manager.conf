[general]
enabled = yes
port = 5038
bindaddr = 0.0.0.0

; Usuário dedicado ao queue-api. Permissões mínimas necessárias:
; ler eventos de fila/canal (call, agent) e originar/redirecionar
; chamadas (para o pickup dirigido via Redirect).
[queue-api]
secret = troque_esta_senha_ami
read = system,call,agent,user,cdr,dialplan
write = system,call,agent,user,originate
; Restrinja isso ao IP real de onde o queue-api roda em produção.
; Com network_mode: host, o serviço roda no mesmo host do Asterisk.
deny = 0.0.0.0/0.0.0.0
permit = 127.0.0.1/255.255.255.255

; Usuário dedicado ao admin-api (backlog #10). Só precisa recarregar
; config (pjsip/dialplan/voicemail) depois que o painel gera os
; arquivos dinâmicos - não precisa ler eventos de chamada.
[admin-api]
secret = troque_esta_senha_ami_admin
read = system
write = system,command,config
deny = 0.0.0.0/0.0.0.0
permit = 127.0.0.1/255.255.255.255
