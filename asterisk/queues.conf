[general]
persistentmembers = yes
monitor-format = wav

;=====================================================
; Fila do tenant 1. A telefonista (t1-recepcao) é o único membro
; estático - quando ela está livre, o Asterisk toca direto nela
; (ringall com 1 membro = toca só nela mesmo). Quando ela está
; ocupada, a chamada fica esperando (música de espera) até ela ficar
; livre OU até a telefonista "puxar" essa chamada específica pelo
; painel da interface web (ver queue-api + manual 08).
;
; monitor-type=mixmonitor grava automaticamente toda chamada que
; passa pela fila e é atendida pela telefonista (ver manual 09).
;=====================================================
[fila-t1]
musicclass = default
strategy = ringall
timeout = 15
retry = 5
weight = 0
joinempty = yes
leavewhenempty = no
monitor-type = mixmonitor
member => PJSIP/t1-recepcao
