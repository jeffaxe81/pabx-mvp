[general]
persistentmembers = yes
monitor-format = wav

;=====================================================
; Fila do tenant 1. Múltiplas telefonistas podem logar ao mesmo tempo
; (backlog #8) - strategy=rrmemory distribui as chamadas em
; round-robin entre quem estiver livre, lembrando quem atendeu por
; último (não sempre a mesma pessoa pegando tudo). Se todas estiverem
; ocupadas, a chamada espera (música de espera) até alguém ficar
; livre OU até uma telefonista "puxar" essa chamada específica pelo
; painel da interface web (ver queue-api + manual 08 e manual 14).
;
; monitor-type=mixmonitor grava automaticamente toda chamada que
; passa pela fila e é atendida (ver manual 09).
;=====================================================
[fila-t1]
musicclass = default
strategy = rrmemory
timeout = 15
retry = 5
weight = 0
joinempty = yes
leavewhenempty = no
monitor-type = mixmonitor
member => PJSIP/t1-recepcao
member => PJSIP/t1-recepcao-2

;=====================================================
; Filas por idioma (backlog #30) - cada uma com os ramais que "falam"
; aquele idioma. Neste MVP, com só 2 telefonistas de exemplo,
; t1-recepcao cobre inglês e t1-recepcao-2 cobre espanhol - ajuste
; conforme os idiomas reais da sua equipe. Português continua sendo
; a fila padrão (fila-t1) acima.
;=====================================================
[fila-t1-en]
musicclass = default
strategy = rrmemory
timeout = 15
retry = 5
weight = 0
joinempty = yes
leavewhenempty = no
monitor-type = mixmonitor
member => PJSIP/t1-recepcao

[fila-t1-es]
musicclass = default
strategy = rrmemory
timeout = 15
retry = 5
weight = 0
joinempty = yes
leavewhenempty = no
monitor-type = mixmonitor
member => PJSIP/t1-recepcao-2

;=====================================================
; TENANT 2 - mesmo padrão de filas do tenant 1 acima (fila padrão +
; inglês + espanhol), provando que o desenho generaliza pra múltiplos
; tenants em vez de existir só no tenant 1 (backlog atendido no
