;=====================================================
; PABX MVP - PJSIP com criptografia, multi-tenant e tronco
;=====================================================

[global]
type=global
endpoint=default
max_forwards=70

;-----------------------------------------------------
; TRANSPORTES
;-----------------------------------------------------

; UDP - mantido para compatibilidade com softphones antigos / testes
[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

; TLS - sinalização SIP criptografada (troque os certs em produção)
[transport-tls]
type=transport
protocol=tls
bind=0.0.0.0:5061
cert_file=/etc/asterisk/certs/asterisk.crt
priv_key_file=/etc/asterisk/certs/asterisk.key
method=tlsv1_2

; WSS - transporte para telefones web (WebRTC). A porta real de escuta
; é controlada pelo http.conf (8089), este bloco só identifica o
; transporte para os endpoints que usam webrtc=yes.
[transport-wss]
type=transport
protocol=wss
bind=0.0.0.0

;=====================================================
; TEMPLATE BASE - usado por todos os ramais (evita repetir config)
;=====================================================
[endpoint-base](!)
type=endpoint
disallow=all
allow=ulaw,alaw,opus
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes

; Template SEM criptografia (uso em rede interna/testes)
[endpoint-plain](endpoint-base!)

; Template COM criptografia SRTP (uso recomendado / produção)
[endpoint-secure](endpoint-base!)
media_encryption=sdes
media_encryption_optimistic=no
transport=transport-tls

; Template para telefone WEB (WebRTC) - usado pela interface do telefonista
[endpoint-webrtc](endpoint-base!)
allow=opus,ulaw,alaw
transport=transport-wss
webrtc=yes
media_encryption=dtls
dtls_auto_generate_cert=yes
ice_support=yes
use_avpf=yes
rtcp_mux=yes

;=====================================================
; TENANT 1 (empresa A) - contexto isolado: t1-internal
;=====================================================

; Ramal 1001 - versão SEGURA (TLS+SRTP) - use esta como padrão
[t1-1001](endpoint-secure)
context=t1-internal
subscribe_context=t1-hints
auth=t1-1001
aors=t1-1001
callerid=T1 Ramal 1001 <1001>
mailboxes=t1-1001@t1

[t1-1001]
type=auth
auth_type=userpass
username=t1-1001
password=troque_esta_senha_1001

[t1-1001]
type=aor
max_contacts=1
remove_existing=yes

; Ramal 1002 (tenant 1)
[t1-1002](endpoint-secure)
context=t1-internal
subscribe_context=t1-hints
auth=t1-1002
aors=t1-1002
callerid=T1 Ramal 1002 <1002>
mailboxes=t1-1002@t1

[t1-1002]
type=auth
auth_type=userpass
username=t1-1002
password=troque_esta_senha_1002

[t1-1002]
type=aor
max_contacts=1
remove_existing=yes

;=====================================================
; TELEFONISTAS WEB (tenant 1) - ramais acessados pelo navegador via
; WebRTC, usados pela interface em webphone/index.html. Múltiplos
; operadores podem estar logados ao mesmo tempo (backlog #8) - a fila
; distribui as chamadas entre eles (ver queues.conf, strategy=rrmemory).
;
; Para adicionar um 3º operador, duplique um bloco destes trocando o
; nome (ex: t1-recepcao-3), adicione como membro em queues.conf, um
; hint em t1-hints, e uma entrada em [pickup-target] no
; extensions.conf.
;=====================================================
[t1-recepcao](endpoint-webrtc)
context=t1-internal
subscribe_context=t1-hints
auth=t1-recepcao
aors=t1-recepcao
callerid=Recepcao Web 1 <1010>
mailboxes=t1-recepcao@t1

[t1-recepcao]
type=auth
auth_type=userpass
username=t1-recepcao
password=troque_esta_senha_web

[t1-recepcao]
type=aor
max_contacts=1
remove_existing=yes

[t1-recepcao-2](endpoint-webrtc)
context=t1-internal
subscribe_context=t1-hints
auth=t1-recepcao-2
aors=t1-recepcao-2
callerid=Recepcao Web 2 <1011>
mailboxes=t1-recepcao-2@t1

[t1-recepcao-2]
type=auth
auth_type=userpass
username=t1-recepcao-2
password=troque_esta_senha_web_2

[t1-recepcao-2]
type=aor
max_contacts=1
remove_existing=yes

;=====================================================
; TENANT 2 (empresa B) - contexto isolado: t2-internal
; Mesma numeração de ramal (1001), mas totalmente separado
;=====================================================

[t2-1001](endpoint-secure)
context=t2-internal
subscribe_context=t2-hints
auth=t2-1001
aors=t2-1001
callerid=T2 Ramal 1001 <1001>
mailboxes=t2-1001@t2

[t2-1001]
type=auth
auth_type=userpass
username=t2-1001
password=troque_esta_senha_2001

[t2-1001]
type=aor
max_contacts=1
remove_existing=yes

; Telefonistas web do tenant 2 - mesmo padrão de t1-recepcao/
; t1-recepcao-2, pra que todo o resto (fila, URA, grupos de toque,
; callback, pesquisa de satisfação) generalize de verdade pra
; múltiplos tenants em vez de existir só no tenant 1 (ver manual 38).
[t2-recepcao](endpoint-webrtc)
context=t2-internal
subscribe_context=t2-hints
auth=t2-recepcao
aors=t2-recepcao
callerid=Recepcao Web 1 (T2) <1010>
mailboxes=t2-recepcao@t2

[t2-recepcao]
type=auth
auth_type=userpass
username=t2-recepcao
password=troque_esta_senha_web_t2

[t2-recepcao]
type=aor
max_contacts=1
remove_existing=yes

[t2-recepcao-2](endpoint-webrtc)
context=t2-internal
subscribe_context=t2-hints
auth=t2-recepcao-2
aors=t2-recepcao-2
callerid=Recepcao Web 2 (T2) <1011>
mailboxes=t2-recepcao-2@t2

[t2-recepcao-2]
type=auth
auth_type=userpass
username=t2-recepcao-2
password=troque_esta_senha_web_t2_2

[t2-recepcao-2]
type=aor
max_contacts=1
remove_existing=yes

;=====================================================
; TRONCO PARA GATEWAY TDM (ex: Grandstream GXW, AudioCodes MP-11x)
; O gateway converte TDM (linha analógica/E1/T1) <-> SIP.
; Do lado do Asterisk, ele é só mais um peer SIP autenticado por IP.
;=====================================================
[gateway-tdm]
type=endpoint
context=from-tdm-gateway
disallow=all
allow=ulaw,alaw
transport=transport-udp
aors=gateway-tdm
identify_by=ip

[gateway-tdm]
type=identify
endpoint=gateway-tdm
match=192.168.1.200      ; <-- IP real do gateway TDM na sua rede

[gateway-tdm]
type=aor
contact=sip:192.168.1.200:5060

;=====================================================
; TRONCO ALTERNATIVO - rota diferente por prefixo (backlog #14 do
; documento de funcionalidades: "prefixos para escolher rotas
; diferentes"). Ex: uma operadora mais barata pra chamadas
; internacionais, ou uma operadora backup. Placeholder de exemplo,
; mesma lógica do gateway-tdm - troque o IP pelo real.
;=====================================================
[gateway-tdm-2]
type=endpoint
context=from-tdm-gateway
disallow=all
allow=ulaw,alaw
transport=transport-udp
aors=gateway-tdm-2
identify_by=ip

[gateway-tdm-2]
type=identify
endpoint=gateway-tdm-2
match=192.168.1.201      ; <-- IP real da operadora alternativa

[gateway-tdm-2]
type=aor
contact=sip:192.168.1.201:5060

;=====================================================
; RAMAIS GERENCIADOS PELO PAINEL DE ADMINISTRAÇÃO (backlog #10)
; Gerado e mantido pelo admin-api - não editar na mão, ver manual 16.
;=====================================================
#include pjsip_dynamic.conf

;=====================================================
; TENANTS CRIADOS PELO WIZARD DE PREPARAÇÃO DE AMBIENTE (backlog #39)
; Um arquivo por tenant (t3.conf, t4.conf, ...) - #include com
; wildcard, então criar um tenant novo NUNCA precisa editar este
; arquivo. t1/t2 continuam definidos estaticamente acima (exemplos
; originais do projeto). Ver manual 39.
;=====================================================
#include pjsip_tenants/*.conf
