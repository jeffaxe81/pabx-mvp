;=====================================================
; PABX MVP - PJSIP com criptografia, multi-tenant e tronco
;=====================================================

[global]
type=global
endpoint=default
max_forwards=70

;-----------------------------------------------------
; TRANSPORTES
;-----------------------------------------------------

; UDP - mantido para compatibilidade com softphones antigos / testes
[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

; TLS - sinalização SIP criptografada (troque os certs em produção)
[transport-tls]
type=transport
protocol=tls
bind=0.0.0.0:5061
cert_file=/etc/asterisk/certs/asterisk.crt
priv_key_file=/etc/asterisk/certs/asterisk.key
method=tlsv1_2

;=====================================================
; TEMPLATE BASE - usado por todos os ramais (evita repetir config)
;=====================================================
[endpoint-base](!)
type=endpoint
disallow=all
allow=ulaw,alaw,opus
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes

; Template SEM criptografia (uso em rede interna/testes)
[endpoint-plain](endpoint-base!)

; Template COM criptografia SRTP (uso recomendado / produção)
[endpoint-secure](endpoint-base!)
media_encryption=sdes
media_encryption_optimistic=no
transport=transport-tls

;=====================================================
; TENANT 1 (empresa A) - contexto isolado: t1-internal
;=====================================================

; Ramal 1001 - versão SEGURA (TLS+SRTP) - use esta como padrão
[t1-1001](endpoint-secure)
context=t1-internal
auth=t1-1001
aors=t1-1001
callerid=T1 Ramal 1001 <1001>
mailboxes=t1-1001@t1

[t1-1001]
type=auth
auth_type=userpass
username=t1-1001
password=troque_esta_senha_1001

[t1-1001]
type=aor
max_contacts=1
remove_existing=yes

; Ramal 1002 (tenant 1)
[t1-1002](endpoint-secure)
context=t1-internal
auth=t1-1002
aors=t1-1002
callerid=T1 Ramal 1002 <1002>
mailboxes=t1-1002@t1

[t1-1002]
type=auth
auth_type=userpass
username=t1-1002
password=troque_esta_senha_1002

[t1-1002]
type=aor
max_contacts=1
remove_existing=yes

;=====================================================
; TENANT 2 (empresa B) - contexto isolado: t2-internal
; Mesma numeração de ramal (1001), mas totalmente separado
;=====================================================

[t2-1001](endpoint-secure)
context=t2-internal
auth=t2-1001
aors=t2-1001
callerid=T2 Ramal 1001 <1001>
mailboxes=t2-1001@t2

[t2-1001]
type=auth
auth_type=userpass
username=t2-1001
password=troque_esta_senha_2001

[t2-1001]
type=aor
max_contacts=1
remove_existing=yes

;=====================================================
; TRONCO PARA GATEWAY TDM (ex: Grandstream GXW, AudioCodes MP-11x)
; O gateway converte TDM (linha analógica/E1/T1) <-> SIP.
; Do lado do Asterisk, ele é só mais um peer SIP autenticado por IP.
;=====================================================
[gateway-tdm]
type=endpoint
context=from-tdm-gateway
disallow=all
allow=ulaw,alaw
transport=transport-udp
aors=gateway-tdm
identify_by=ip

[gateway-tdm]
type=identify
endpoint=gateway-tdm
match=192.168.1.200      ; <-- IP real do gateway TDM na sua rede

[gateway-tdm]
type=aor
contact=sip:192.168.1.200:5060
