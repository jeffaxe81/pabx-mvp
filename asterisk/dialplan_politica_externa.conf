; Politica opcional de discagem externa por tenant.
; Nao habilitada automaticamente. Requer integracao no dialplan e homologacao.
; Variaveis esperadas: TENANT e DESTINO (somente digitos).
; AstDB: politica-externa-<tenant>/internacional = bloquear
[politica-externa]
exten => s,1,NoOp(Validacao de politica externa)
 same => n,GotoIf($["${TENANT}" = ""]?negado)
 same => n,GotoIf($["${DESTINO}" = ""]?negado)
 same => n,GotoIf($[${REGEX("^t[0-9]+$" ${TENANT})} != 1]?negado)
 same => n,GotoIf($[${REGEX("^[0-9]+$" ${DESTINO})} != 1]?negado)
 same => n,GotoIf($["${DESTINO:0:2}" != "00"]?permitido)
 same => n,GotoIf($["${DB(politica-externa-${TENANT}/internacional)}" = "bloquear"]?negado)
 same => n(permitido),Set(GOSUB_RETVAL=ALLOW)
 same => n,Return()
 same => n(negado),Set(GOSUB_RETVAL=DENY)
 same => n,Return()
