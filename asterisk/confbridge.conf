;=====================================================
; SALA DE CONFERÊNCIA AD-HOC (backlog #43) - diferente de grupo de
; toque (manual 24, que só toca em vários ramais até UM atender): aqui
; várias pessoas conversam ao mesmo tempo de verdade, numa sala.
;
; Perfis GENÉRICOS e compartilhados entre tenants (o isolamento vem do
; NOME da sala, não do perfil - ver extensions.conf: cada tenant
; monta o nome com o próprio prefixo, ex: "sala-t1-0001" vs
; "sala-t2-0001", nunca colidem mesmo discando o mesmo número).
;=====================================================

[default_bridge]
type = bridge
max_members = 20
; Gravação de conferência é opt-in (backlog #12 da auditoria, não
; implementado ainda) - desligada por padrão.
record_conference = no

[default_user]
type = user
; avisa quando alguém entra/sai - ninguém aparece/some em silêncio
announce_join_leave = yes
; avisa quantas pessoas já estão na sala ao entrar
announce_user_count = yes
; sozinho na sala = música de espera, não silêncio total
music_on_hold_when_empty = yes

[default_menu]
type = menu
; "*" alterna mudo/áudio pra quem está na sala - o gesto mais comum
; de conferência, sem precisar decorar vários códigos.
* = toggle_mute
