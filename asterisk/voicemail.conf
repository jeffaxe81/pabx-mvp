[general]
format=wav49|gsm|wav
attach=yes
skipms=3000
maxsilence=10
silencethreshold=128
maxlogins=3

; Envio de correio de voz por e-mail (backlog #16). O container do
; Asterisk não tem um MTA (sendmail/postfix) de verdade, então
; mailcmd chama um script que repassa pra um servidor SMTP externo -
; ver asterisk/scripts/mail_relay.py e manual 22. Sem SMTP_HOST
; configurado no docker-compose, o script simplesmente não envia nada
; (desligado por padrão).
serveremail=pabx@localhost
mailcmd=/usr/bin/python3 /var/lib/asterisk/scripts/mail_relay.py

; Contexto de voicemail por tenant (isola as caixas de mensagem)
; Formato: ramal => senha,Nome,email (email é opcional - sem ele, a
; caixa de voz funciona normalmente, só não manda e-mail nenhum)
[t1]
t1-1001 => 1234,T1 Ramal 1001,t1-1001@example.com
t1-1002 => 1234,T1 Ramal 1002,t1-1002@example.com
t1-recepcao => 1234,T1 Recepcao Web 1
t1-recepcao-2 => 1234,T1 Recepcao Web 2
; Ramais gerenciados pelo painel de administração (backlog #10)
#include voicemail_dynamic_t1.conf

[t2]
t2-1001 => 1234,T2 Ramal 1001
t2-recepcao => 1234,T2 Recepcao Web 1
t2-recepcao-2 => 1234,T2 Recepcao Web 2
; Ramais gerenciados pelo painel de administração (backlog #10) - o
; tenant 2 ainda não tem ramais dinâmicos criados pelo painel, mas o
; #include já vem pronto pra quando isso acontecer (ver manual 38)
#include voicemail_dynamic_t2.conf
