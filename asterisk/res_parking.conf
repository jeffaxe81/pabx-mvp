;=====================================================
; ESTACIONAMENTO DE CHAMADA (backlog #41) - clássico do PABX: a
; telefonista transfere a chamada pra uma "vaga" (dígito 75) em vez
; de pra um ramal específico, e QUALQUER ramal do mesmo tenant pode
; recuperar depois discando o número da vaga (76-95). Se ninguém
; recuperar dentro do prazo, a chamada toca de volta pra quem
; estacionou (comebacktoorigin).
;
; Uma vaga de estacionamento POR TENANT (context=t1-internal /
; t2-internal) - números podem repetir entre tenants (75/76-95 nos
; dois), mas uma chamada estacionada no tenant 1 nunca aparece pro
; tenant 2, seguindo o mesmo isolamento do resto do dialplan (manual
; 38). Tenants criados pelo wizard (manual 39) ganham a vaga própria
; automaticamente - ver #include com wildcard no final deste arquivo.
;=====================================================

[general]
; Só as vagas explicitamente configuradas abaixo existem - nada
; dinâmico/implícito que poderia vazar entre tenants.
parkeddynamic = no

[parkinglot-t1]
context = t1-internal
parkext = 75
parkpos = 76-95
parkinghints = yes
comebacktoorigin = yes
parkedmusicclass = default

[parkinglot-t2]
context = t2-internal
parkext = 75
parkpos = 76-95
parkinghints = yes
comebacktoorigin = yes
parkedmusicclass = default

; Tenants criados pelo wizard de preparação de ambiente (backlog #39) -
; mesmo padrão de #include com wildcard já usado em pjsip.conf/
; queues.conf/extensions.conf/voicemail.conf.
#include parking_tenants/*.conf
