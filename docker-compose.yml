version: "3.8"

services:
  asterisk:
    image: andrius/asterisk:latest
    container_name: pabx-mvp
    restart: unless-stopped
    network_mode: host   # necessário para SIP/RTP funcionarem sem dor de cabeça com NAT
    volumes:
      - ./asterisk/pjsip.conf:/etc/asterisk/pjsip.conf
      - ./asterisk/pjsip_dynamic.conf:/etc/asterisk/pjsip_dynamic.conf
      - ./asterisk/extensions.conf:/etc/asterisk/extensions.conf
      - ./asterisk/extensions_dynamic_dial.conf:/etc/asterisk/extensions_dynamic_dial.conf
      - ./asterisk/extensions_dynamic_hints.conf:/etc/asterisk/extensions_dynamic_hints.conf
      - ./asterisk/voicemail.conf:/etc/asterisk/voicemail.conf
      - ./asterisk/voicemail_dynamic_t1.conf:/etc/asterisk/voicemail_dynamic_t1.conf
      - ./asterisk/rtp.conf:/etc/asterisk/rtp.conf
      - ./asterisk/http.conf:/etc/asterisk/http.conf
      - ./asterisk/manager.conf:/etc/asterisk/manager.conf
      - ./asterisk/queues.conf:/etc/asterisk/queues.conf
      - ./asterisk/cdr.conf:/etc/asterisk/cdr.conf
      - ./asterisk/cdr_manager.conf:/etc/asterisk/cdr_manager.conf
      - ./asterisk/certs:/etc/asterisk/certs:ro
      - ./asterisk/scripts:/var/lib/asterisk/scripts:ro
      - ./asterisk/sounds/custom:/var/lib/asterisk/sounds/custom:ro
      - ./recordings:/var/spool/asterisk/monitor
      - asterisk_data:/var/spool/asterisk
    environment:
      # Envio de correio de voz por e-mail (backlog #16) - vazio =
      # desabilitado (mail_relay.py sai sem enviar nada). Mesmas
      # credenciais SMTP podem ser reaproveitadas das notificações de
      # chamada perdida do queue-api (SMTP_HOST/SMTP_PORT/etc.).
      SMTP_HOST: ""
      SMTP_PORT: "587"
      SMTP_USERNAME: ""
      SMTP_PASSWORD: ""
      SMTP_USE_TLS: "true"

  # Backend que fala AMI com o Asterisk e expõe a fila de atendimento
  # (quem está esperando) como uma API HTTP simples pro webphone consumir.
  queue-api:
    image: python:3.12-slim
    container_name: pabx-queue-api
    restart: unless-stopped
    network_mode: host   # precisa enxergar o Asterisk em 127.0.0.1:5038 (AMI)
    working_dir: /app
    volumes:
      - ./queue-api:/app:ro
      - ./recordings:/app/recordings
      - queue_api_data:/app/data
    environment:
      AMI_HOST: "127.0.0.1"
      AMI_PORT: "5038"
      AMI_USERNAME: "queue-api"
      AMI_SECRET: "troque_esta_senha_ami"   # deve bater com manager.conf
      HTTP_PORT: "8090"
      # Pickup dirigido (backlog #2/#8) - quais ramais podem "puxar"
      # uma chamada da fila. Adicione novos operadores aqui também.
      PICKUP_ALLOWED_EXTENSIONS: "t1-recepcao,t1-recepcao-2"
      RECORDINGS_DIR: "/app/recordings"
      # Retenção de gravações (backlog #15) - 0 = desabilitado (nunca
      # apaga nada sozinho). Defina em dias (ex: "90") pra ativar o
      # expurgo automático diário.
      RECORDINGS_RETENTION_DAYS: "0"
      CALL_LOG_PATH: "/app/data/call_log.jsonl"
      # Screen-pop pro CRM (backlog #13) - vazio = desabilitado. Quando
      # uma chamada começa a tocar, o queue-api faz um POST nessa URL
      # com o número/nome de quem está ligando, pro CRM abrir o
      # cadastro do cliente automaticamente.
      CRM_WEBHOOK_URL: ""
      # Detecção de fraude (backlog #32) - alerta sempre ativo (limiar
      # padrão razoável); bloqueio automático e limite de gasto vêm
      # DESLIGADOS por padrão (opt-in, ver manual 27).
      FRAUD_RATE_WINDOW_SECONDS: "60"
      FRAUD_RATE_THRESHOLD: "10"
      FRAUD_AUTO_BLOCK: "false"
      FRAUD_COST_PER_MINUTE: "0"
      FRAUD_DAILY_COST_LIMIT: "0"
      # Notificação de chamada perdida - vazio = desabilitado.
      # Preencha com "email", "whatsapp" ou "email,whatsapp" pra ativar.
      NOTIFY_CHANNELS: ""
      SMTP_HOST: ""
      SMTP_PORT: "587"
      SMTP_USERNAME: ""
      SMTP_PASSWORD: ""
      SMTP_FROM: ""
      SMTP_TO: ""
      WHATSAPP_PHONE_NUMBER_ID: ""
      WHATSAPP_ACCESS_TOKEN: ""
      WHATSAPP_TO_NUMBER: ""
      # Click-to-call (CRM externo disparando ligação) - vazio =
      # desabilitado. Preencha CLICK_TO_CALL_API_KEY com uma chave
      # forte pra ativar; o CRM precisa enviá-la no header
      # X-Click-To-Call-Key em toda requisição.
      CLICK_TO_CALL_API_KEY: ""
      CLICK_TO_CALL_ALLOWED_EXTENSIONS: "t1-recepcao"
      CLICK_TO_CALL_CONTEXT: "click-to-call"
    command: python3 server.py
    depends_on:
      - asterisk

  # Interface web do telefonista (webphone/index.html), servida como
  # site estático simples. Em produção, sirva com HTTPS de verdade
  # (getUserMedia exige contexto seguro fora de localhost).
  webphone:
    image: nginx:alpine
    container_name: pabx-webphone
    restart: unless-stopped
    ports:
      - "8082:80"
    volumes:
      - ./webphone:/usr/share/nginx/html:ro

  # Servidor HTTP simples que entrega os arquivos de auto-provisionamento.
  # Os telefones apontam para http://<ip-servidor>:8080/<MAC>.cfg
  provisioning:
    image: nginx:alpine
    container_name: pabx-provisioning
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./provisioning/files:/usr/share/nginx/html:ro

  # Painel de administração web (backlog #10) - CRUD de ramais do
  # tenant 1, gera os arquivos *_dynamic.conf e manda o Asterisk
  # recarregar via AMI. Vem DESLIGADO por padrão (sem ADMIN_PASSWORD_HASH
  # configurado, o login sempre falha) - ver manual 16 pra como gerar
  # o hash da senha.
  admin-api:
    image: python:3.12-slim
    container_name: pabx-admin-api
    restart: unless-stopped
    network_mode: host   # precisa enxergar o Asterisk em 127.0.0.1:5038 (AMI)
    working_dir: /app
    volumes:
      - ./admin-api:/app:ro
      - ./admin:/app/static:ro
      - ./asterisk:/app/asterisk-conf
      - admin_data:/app/data
    environment:
      HTTP_PORT: "8091"
      STORE_PATH: "/app/data/extensions_store.json"
      USERS_PATH: "/app/data/users.json"
      ASTERISK_CONF_DIR: "/app/asterisk-conf"
      STATIC_DIR: "/app/static"
      AMI_HOST: "127.0.0.1"
      AMI_PORT: "5038"
      AMI_USERNAME: "admin-api"
      AMI_SECRET: "troque_esta_senha_ami_admin"   # deve bater com manager.conf
      ADMIN_USERNAME: "admin"
      ADMIN_PASSWORD_HASH: ""   # vazio = login desabilitado; usado só pra
      # criar o primeiro usuário (papel admin) na primeira vez que o
      # painel sobe - depois disso, gerencie usuários pela própria
      # interface (backlog #19, ver manual 25)
    command: python3 server.py

volumes:
  asterisk_data:
  admin_data:
  queue_api_data:
