version: "3.8"

services:
  asterisk:
    image: andrius/asterisk:latest
    container_name: pabx-mvp
    restart: unless-stopped
    network_mode: host   # necessário para SIP/RTP funcionarem sem dor de cabeça com NAT
    volumes:
      - ./asterisk/pjsip.conf:/etc/asterisk/pjsip.conf
      - ./asterisk/pjsip_dynamic.conf:/etc/asterisk/pjsip_dynamic.conf
      - ./asterisk/extensions.conf:/etc/asterisk/extensions.conf
      - ./asterisk/extensions_dynamic_dial-t1.conf:/etc/asterisk/extensions_dynamic_dial-t1.conf
      - ./asterisk/extensions_dynamic_dial-t2.conf:/etc/asterisk/extensions_dynamic_dial-t2.conf
      - ./asterisk/extensions_dynamic_hints-t1.conf:/etc/asterisk/extensions_dynamic_hints-t1.conf
      - ./asterisk/extensions_dynamic_hints-t2.conf:/etc/asterisk/extensions_dynamic_hints-t2.conf
      - ./asterisk/voicemail.conf:/etc/asterisk/voicemail.conf
      - ./asterisk/voicemail_dynamic_t1.conf:/etc/asterisk/voicemail_dynamic_t1.conf
      - ./asterisk/voicemail_dynamic_t2.conf:/etc/asterisk/voicemail_dynamic_t2.conf
      # Tenants criados pelo wizard de preparação de ambiente (backlog
      # #39, ver manual 39) - montados como DIRETÓRIO (não arquivo por
      # arquivo) porque o admin-api gera um arquivo novo por tenant
      # sem avisar o docker-compose - #include com wildcard nos .conf
      # estáticos encontra qualquer arquivo que aparecer aqui.
      - ./asterisk/pjsip_tenants:/etc/asterisk/pjsip_tenants
      - ./asterisk/queues_tenants:/etc/asterisk/queues_tenants
      - ./asterisk/extensions_tenants:/etc/asterisk/extensions_tenants
      - ./asterisk/voicemail_tenants:/etc/asterisk/voicemail_tenants
      - ./asterisk/res_parking.conf:/etc/asterisk/res_parking.conf
      - ./asterisk/confbridge.conf:/etc/asterisk/confbridge.conf
      - ./asterisk/parking_tenants:/etc/asterisk/parking_tenants
      - ./asterisk/rtp.conf:/etc/asterisk/rtp.conf
      - ./asterisk/http.conf:/etc/asterisk/http.conf
      - ./asterisk/manager.conf:/etc/asterisk/manager.conf
      - ./asterisk/queues.conf:/etc/asterisk/queues.conf
      - ./asterisk/cdr.conf:/etc/asterisk/cdr.conf
      - ./asterisk/cdr_manager.conf:/etc/asterisk/cdr_manager.conf
      - ./asterisk/certs:/etc/asterisk/certs:ro
      - ./asterisk/scripts:/var/lib/asterisk/scripts:ro
      - ./asterisk/sounds/custom:/var/lib/asterisk/sounds/custom:ro
      - ./asterisk/agi:/var/lib/asterisk/agi-bin:ro
      - ./recordings:/var/spool/asterisk/monitor
      - asterisk_data:/var/spool/asterisk
    environment:
      # Envio de correio de voz por e-mail (backlog #16) - vazio =
      # desabilitado (mail_relay.py sai sem enviar nada). Mesmas
      # credenciais SMTP podem ser reaproveitadas das notificações de
      # chamada perdida do queue-api (SMTP_HOST/SMTP_PORT/etc.).
      SMTP_HOST: ""
      SMTP_PORT: "587"
      SMTP_USERNAME: ""
      SMTP_PASSWORD: ""
      SMTP_USE_TLS: "true"
      # Atendente virtual com IA (backlog #24, ver manual 37) - só usado
      # se o AGI atendente_virtual.py for de fato executado no dialplan.
      AI_WORKER_URL: "http://ai-worker:8092"

  # Backend que fala AMI com o Asterisk e expõe a fila de atendimento
  # (quem está esperando) como uma API HTTP simples pro webphone consumir.
  queue-api:
    image: python:3.12-slim
    container_name: pabx-queue-api
    restart: unless-stopped
    network_mode: host   # precisa enxergar o Asterisk em 127.0.0.1:5038 (AMI)
    working_dir: /app
    volumes:
      - ./queue-api:/app:ro
      - ./recordings:/app/recordings
      - queue_api_data:/app/data
    environment:
      AMI_HOST: "127.0.0.1"
      AMI_PORT: "5038"
      AMI_USERNAME: "queue-api"
      AMI_SECRET: "troque_esta_senha_ami"   # deve bater com manager.conf
      HTTP_PORT: "8090"
      # SLA de fila (backlog #46) - meta comum de mercado é 80% em até
      # 20s; ajuste conforme a meta real da operação.
      SLA_THRESHOLD_SECONDS: "20"
      # Pickup dirigido (backlog #2/#8) - quais ramais podem "puxar"
      # uma chamada da fila. Adicione novos operadores aqui também.
      PICKUP_ALLOWED_EXTENSIONS: "t1-recepcao,t1-recepcao-2,t2-recepcao,t2-recepcao-2"
      PICKUP_CONTEXT: "pickup-target"
      RECORDINGS_DIR: "/app/recordings"
      # Retenção de gravações (backlog #15) - 0 = desabilitado (nunca
      # apaga nada sozinho). Defina em dias (ex: "90") pra ativar o
      # expurgo automático diário.
      RECORDINGS_RETENTION_DAYS: "0"
      CALL_LOG_PATH: "/app/data/call_log.jsonl"
      CAMPAIGNS_PATH: "/app/data/campaigns.json"
      CALLBACKS_PATH: "/app/data/callbacks.json"
      CALLBACK_CONNECT_CONTEXT: "callback-connect"
      SURVEY_PATH: "/app/data/survey.jsonl"
      PRESENCE_PATH: "/app/data/presence.json"
      # Screen-pop pro CRM (backlog #13) - vazio = desabilitado. Quando
      # uma chamada começa a tocar, o queue-api faz um POST nessa URL
      # com o número/nome de quem está ligando, pro CRM abrir o
      # cadastro do cliente automaticamente.
      CRM_WEBHOOK_URL: ""
      # Detecção de fraude (backlog #32) - alerta sempre ativo (limiar
      # padrão razoável); bloqueio automático e limite de gasto vêm
      # DESLIGADOS por padrão (opt-in, ver manual 27).
      FRAUD_RATE_WINDOW_SECONDS: "60"
      FRAUD_RATE_THRESHOLD: "10"
      FRAUD_AUTO_BLOCK: "false"
      FRAUD_COST_PER_MINUTE: "0"
      FRAUD_DAILY_COST_LIMIT: "0"
      # Monitoramento de qualidade (backlog #34) - só visibilidade,
      # sem ação com efeito colateral, então já vem ativo por padrão.
      QUALITY_JITTER_THRESHOLD_MS: "30"
      QUALITY_PACKET_LOSS_THRESHOLD_PERCENT: "3"
      # Notificação de chamada perdida - vazio = desabilitado.
      # Preencha com "email", "whatsapp" ou "email,whatsapp" pra ativar.
      NOTIFY_CHANNELS: ""
      SMTP_HOST: ""
      SMTP_PORT: "587"
      SMTP_USERNAME: ""
      SMTP_PASSWORD: ""
      SMTP_FROM: ""
      SMTP_TO: ""
      WHATSAPP_PHONE_NUMBER_ID: ""
      WHATSAPP_ACCESS_TOKEN: ""
      WHATSAPP_TO_NUMBER: ""
      # Click-to-call (CRM externo disparando ligação) - vazio =
      # desabilitado. Preencha CLICK_TO_CALL_API_KEY com uma chave
      # forte pra ativar; o CRM precisa enviá-la no header
      # X-Click-To-Call-Key em toda requisição.
      CLICK_TO_CALL_API_KEY: ""
      CLICK_TO_CALL_ALLOWED_EXTENSIONS: "t1-recepcao,t2-recepcao"
      CLICK_TO_CALL_CONTEXT: "click-to-call"
    command: python3 server.py
    depends_on:
      - asterisk

  # Interface web do telefonista (webphone/index.html), servida como
  # site estático simples. Em produção, sirva com HTTPS de verdade
  # (getUserMedia exige contexto seguro fora de localhost).
  webphone:
    image: nginx:alpine
    container_name: pabx-webphone
    restart: unless-stopped
    ports:
      - "8082:80"
    volumes:
      - ./webphone:/usr/share/nginx/html:ro

  # Servidor HTTP simples que entrega os arquivos de auto-provisionamento.
  # Os telefones apontam para http://<ip-servidor>:8080/<MAC>.cfg
  provisioning:
    image: nginx:alpine
    container_name: pabx-provisioning
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./provisioning/files:/usr/share/nginx/html:ro

  # Painel de administração web (backlog #10) - CRUD de ramais do
  # tenant 1, gera os arquivos *_dynamic.conf e manda o Asterisk
  # recarregar via AMI. Vem DESLIGADO por padrão (sem ADMIN_PASSWORD_HASH
  # configurado, o login sempre falha) - ver manual 16 pra como gerar
  # o hash da senha.
  admin-api:
    image: python:3.12-slim
    container_name: pabx-admin-api
    restart: unless-stopped
    network_mode: host   # precisa enxergar o Asterisk em 127.0.0.1:5038 (AMI)
    working_dir: /app
    volumes:
      - ./admin-api:/app:ro
      - ./admin:/app/static:ro
      - ./asterisk:/app/asterisk-conf
      - admin_data:/app/data
    environment:
      HTTP_PORT: "8091"
      STORE_PATH: "/app/data/extensions_store.json"
      TENANTS_PATH: "/app/data/tenants.json"
      # TTS (backlog #48) - pra proxy do endpoint de geração de áudio
      # (painel de administração -> admin-api -> ai-worker).
      AI_WORKER_URL: "http://ai-worker:8092"
      USERS_PATH: "/app/data/users.json"
      ASTERISK_CONF_DIR: "/app/asterisk-conf"
      STATIC_DIR: "/app/static"
      AMI_HOST: "127.0.0.1"
      AMI_PORT: "5038"
      AMI_USERNAME: "admin-api"
      AMI_SECRET: "troque_esta_senha_ami_admin"   # deve bater com manager.conf
      ADMIN_USERNAME: "admin"
      ADMIN_PASSWORD_HASH: ""   # vazio = login desabilitado; usado só pra
      # criar o primeiro usuário (papel admin) na primeira vez que o
      # painel sobe - depois disso, gerencie usuários pela própria
      # interface (backlog #19, ver manual 25)
    command: python3 server.py

  # Backup automático (backlog #33) - empacota configs + dados de
  # negócio uma vez por dia. NÃO é alta disponibilidade/failover de
  # verdade (isso exigiria uma segunda instância de Asterisk) - é
  # backup + procedimento de restauração documentado, ver manual 28.
  # De propósito, este container NÃO tem acesso ao socket do Docker
  # (evita dar acesso root-equivalente a um container só pra backup) -
  # por isso os volumes nomeados são montados diretamente aqui, e a
  # restauração deles é um passo manual documentado (backup/restore.sh).
  backup:
    image: python:3.12-slim
    container_name: pabx-backup
    restart: unless-stopped
    volumes:
      - ./asterisk:/pabx/asterisk:ro
      - ./admin:/pabx/admin:ro
      - ./webphone:/pabx/webphone:ro
      - ./provisioning:/pabx/provisioning:ro
      - ./recordings:/pabx/recordings:ro
      - ./docker-compose.yml:/pabx/docker-compose.yml:ro
      - ./prompt-base-pabx.md:/pabx/prompt-base-pabx.md:ro
      - admin_data:/pabx/admin_data:ro
      - queue_api_data:/pabx/queue_api_data:ro
      - ./backup:/pabx-scripts:ro
      - ./backups:/backups
    environment:
      # 0 = nunca apaga backup antigo sozinho (opt-in, mesmo padrão do
      # resto do projeto). Defina em dias (ex: "30") pra ativar.
      BACKUP_RETENTION_DAYS: "0"
    command: sh -c "while true; do sh /pabx-scripts/backup.sh; sleep 86400; done"

  # Llama 3 local (backlog #21-24, ver manual 36). Roda o modelo
  # localmente via Ollama - sem chamada pra nenhuma nuvem, sem custo
  # por requisição, mas precisa de CPU/RAM reais (idealmente GPU) e de
  # um download inicial de vários GB (ver manual pra instruções).
  ollama:
    image: ollama/ollama:latest
    container_name: pabx-ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    # Porta não exposta ao host de propósito - só o ai-worker (na
    # mesma rede docker-compose) precisa falar com o Ollama.

  # Transcrição (Whisper local) + resumo/sentimento/classificação de
  # intenção (Llama 3 via Ollama) - backlog #21/#22/#23/#24.
  # DESLIGADO POR PADRÃO (AI_FEATURES_ENABLED=false) - processamento
  # de IA local tem custo computacional real, diferente do resto das
  # integrações "grátis" deste projeto. Ver manual 36 antes de ligar.
  ai-worker:
    build: ./ai-worker
    container_name: pabx-ai-worker
    restart: unless-stopped
    depends_on:
      - ollama
    volumes:
      - ./recordings:/app/recordings:ro
      - ai_worker_data:/app/data
      # TTS (backlog #48) - grava DIRETO na pasta de áudios do
      # Asterisk (não copia bytes via HTTP) - um Playback(custom/...)
      # no dialplan já encontra o arquivo gerado imediatamente.
      - ./asterisk/sounds/custom:/app/sounds-output
    environment:
      AI_FEATURES_ENABLED: "false"
      OLLAMA_URL: "http://ollama:11434"
      OLLAMA_MODEL: "llama3"
      WHISPER_MODEL_SIZE: "base"   # tiny/base/small/medium - maior = mais preciso e mais lento
      SCAN_INTERVAL_SECONDS: "60"
      TRANSCRIPTS_PATH: "/app/data/transcripts.jsonl"
      # TTS (backlog #48) - Piper (padrão, MIT) sempre disponível
      # quando AI_FEATURES_ENABLED está ligado. XTTS-v2 tem flag
      # PRÓPRIA, separada - Coqui Public Model License proíbe uso
      # comercial sem licença paga da Coqui (empresa que não existe
      # mais desde 2024). NUNCA ative sem confirmar que seu uso é
      # genuinamente não-comercial - ver docs/manual-48.
      TTS_XTTS_ENABLED: "false"
      SOUNDS_OUTPUT_DIR: "/app/sounds-output"
    ports:
      - "8092:8092"

volumes:
  asterisk_data:
  admin_data:
  queue_api_data:
  ollama_data:
  ai_worker_data:
